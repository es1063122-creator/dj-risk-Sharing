<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>위험요인 기간 등록 | dj-safety 관리자</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:"Noto Sans KR",sans-serif;
  background:#f4f7ff;
  color:#0b1b3b;
}
header{
  background:#004080;
  color:#fff;
  padding:16px;
  font-weight:800;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.back-btn{
  background:#fff;
  color:#004080;
  border:none;
  border-radius:8px;
  padding:6px 12px;
  font-weight:700;
  cursor:pointer;
}
.back-btn:hover{
  background:#e0e8ff;
}
main{
  max-width:900px;
  margin:20px auto;
  padding:0 16px;
}
.card{
  background:#fff;
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,64,128,.12);
  padding:20px;
  margin-bottom:20px;
}
label{
  font-size:13px;
  font-weight:700;
  color:#555;
  display:block;
  margin-top:12px;
}
input,select,textarea{
  width:100%;
  padding:10px;
  margin-top:6px;
  border-radius:10px;
  border:1px solid #cdd9ff;
}
textarea{min-height:70px;}
button{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:none;
  font-weight:900;
  background:#004080;
  color:#fff;
  margin-top:16px;
  cursor:pointer;
}
button:hover{opacity:.9;}
.risk{
  border:1px solid #cdd9ff;
  border-radius:12px;
  padding:12px;
  margin-top:10px;
  background:#f9fbff;
}
.risk button{
  width:auto;
  background:#c62828;
  color:#fff;
  padding:6px 10px;
  border-radius:6px;
  font-size:12px;
  margin-top:6px;
}
.muted{color:#64748b;font-size:13px;}
</style>
</head>

<body>

<header>
  <div id="title">위험요인 기간 등록</div>
  <button class="back-btn" onclick="goBack()">← 뒤로가기</button>
</header>

<main>

<div class="card">
  <h2>적용 정보</h2>

  <label>현장 ID</label>
  <input id="siteId">

  <label>현장명</label>
  <input id="siteName">

  <label>적용 시작일</label>
  <input id="startDate" type="date">

  <label>적용 종료일</label>
  <input id="endDate" type="date">

  <label>적용 공종</label>
  <select id="workType">
    <option>토공</option>
    <option>흙막이</option>
    <option>철근</option>
    <option>형틀</option>
    <option>콘크리트</option>
    <option>장비작업</option>
  </select>
</div>

<div class="card">
  <h2>위험요인 목록</h2>

  <label>위험요인 분류</label>
  <input id="category">

  <label>위험요인 내용</label>
  <textarea id="detail"></textarea>

  <label>개선대책</label>
  <textarea id="counter"></textarea>

  <button onclick="addRisk()">+ 위험요인 추가</button>

  <div id="riskList"></div>
</div>

<div class="card">
  <button onclick="saveRiskSet()" id="saveBtn">기간 위험요인 저장</button>
</div>

</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore, doc, setDoc, getDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* Firebase */
const firebaseConfig = {
  apiKey: "AIzaSyAk4jLw9XKxxInc8ua7fZWGOJQKNV7gnzo",
  authDomain: "dj-safety.firebaseapp.com",
  projectId: "dj-safety"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* URL 파라미터 */
const params = new URLSearchParams(location.search);
const paramSiteId = params.get("siteId");
const riskSetId = params.get("id");

/* 상태 */
let risks = [];
let isEdit = false;

/* 뒤로가기 */
window.goBack = () => {
  history.back();
};

/* 수정 모드 */
if(paramSiteId && riskSetId){
  isEdit = true;
  title.innerText = "위험요인 기간 수정";
  saveBtn.innerText = "수정 저장";
  siteId.value = paramSiteId;
  siteId.disabled = true;
  loadRiskSet();
}

/* 위험요인 추가 */
window.addRisk = () => {
  if(!category.value || !detail.value || !counter.value){
    alert("위험요인 정보를 모두 입력하세요");
    return;
  }

  risks.push({
    category: category.value,
    detail: detail.value,
    counter: counter.value
  });

  category.value = "";
  detail.value = "";
  counter.value = "";

  renderRisks();
};

/* 렌더링 */
function renderRisks(){
  riskList.innerHTML = "";
  risks.forEach((r,i)=>{
    const div = document.createElement("div");
    div.className = "risk";
    div.innerHTML = `
      <b>${r.category}</b><br>
      ${r.detail}<br>
      <i>${r.counter}</i><br>
      <button onclick="removeRisk(${i})">삭제</button>
    `;
    riskList.appendChild(div);
  });
}

/* 삭제 */
window.removeRisk = (idx)=>{
  risks.splice(idx,1);
  renderRisks();
};

/* 기존 riskSet 불러오기 */
async function loadRiskSet(){
  const ref = doc(db,"sites",paramSiteId,"riskSets",riskSetId);
  const snap = await getDoc(ref);

  if(!snap.exists()){
    alert("위험요인 데이터를 찾을 수 없습니다.");
    return;
  }

  const d = snap.data();
  siteName.value = d.siteName || "";
  startDate.value = d.startDate;
  endDate.value = d.endDate;
  workType.value = d.workTypes?.[0] || "";
  risks = d.risks || [];

  renderRisks();
}

/* 저장 */
window.saveRiskSet = async ()=>{
  if(!siteId.value || !startDate.value || !endDate.value){
    alert("필수 정보를 입력하세요.");
    return;
  }
  if(risks.length === 0){
    alert("위험요인을 1개 이상 등록하세요.");
    return;
  }

  const id = isEdit ? riskSetId : `${startDate.value}_${endDate.value}`;

  await setDoc(
    doc(db,"sites",siteId.value,"riskSets",id),
    {
      siteId: siteId.value,
      siteName: siteName.value || siteId.value,
      startDate: startDate.value,
      endDate: endDate.value,
      workTypes: [workType.value],
      risks: risks,
      updatedBy: "admin",
      updatedAt: serverTimestamp()
    },
    { merge:true }
  );

  alert(isEdit ? "위험요인 수정 완료" : "위험요인 등록 완료");
  location.href = "dashboard.html";
};
</script>

</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>dj-safety 관리자 대시보드</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">

<style>
:root{
  --blue:#004080;
  --bg:#f4f7ff;
  --card:#ffffff;
  --muted:#64748b;
  --line:#cdd9ff;
}
*{box-sizing:border-box}

body{
  margin:0;
  font-family:"Noto Sans KR",sans-serif;
  background:var(--bg);
  color:#0b1b3b;
}

header{
  background:var(--blue);
  color:#fff;
  padding:16px 20px;
  font-weight:900;
}

header small{opacity:.8;font-weight:400;font-size:12px}

.top-buttons{
  display:flex;
  gap:10px;
  margin-top:10px;
}

.top-btn{
  padding:10px 14px;
  border-radius:10px;
  background:#0f4c81;
  color:#fff;
  border:none;
  font-weight:800;
  cursor:pointer;
}
.top-btn:hover{opacity:.9}

main{
  max-width:1200px;
  margin:20px auto;
  padding:0 18px 40px;
}

.card{
  background:#fff;
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,64,128,.12);
  padding:20px;
  margin-bottom:24px;
}

.card h2{
  margin:0 0 12px;
  font-size:18px;
}

.row{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
}

.field{
  display:flex;
  flex-direction:column;
  gap:4px;
}

input{
  padding:10px;
  border-radius:10px;
  border:1px solid var(--line);
  min-width:150px;
}

button{
  padding:10px 14px;
  border:none;
  border-radius:10px;
  font-weight:800;
  background:var(--blue);
  color:#fff;
  cursor:pointer;
}
button:hover{opacity:.9}

.muted{color:var(--muted);font-size:13px}

.summary-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.summary{
  background:#f9fbff;
  padding:16px;
  border-radius:14px;
  border:1px solid var(--line);
}

.summary-label{font-size:13px;color:var(--muted)}
.summary-value{font-size:22px;font-weight:900;margin-top:4px}

.item{
  border:1px solid var(--line);
  border-radius:12px;
  padding:14px;
  background:#f9fbff;
  margin-bottom:10px;
}

.badge{
  display:inline-block;
  padding:4px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:800;
}

.badge-ok{background:#dcfce7;color:#166534}
.badge-draft{background:#fef3c7;color:#92400e}

.risk-card{
  border:1px solid #dbeafe;
  background:#f9fbff;
  border-radius:14px;
  padding:16px;
  margin-bottom:16px;
  box-shadow:0 4px 14px rgba(0,64,128,0.08);
}

.status-pill{
  padding:6px 12px;
  border-radius:999px;
  color:#fff;
  font-weight:700;
  font-size:13px;
}

.edit-btn{
  padding:6px 12px;
  background:#004080;
  border-radius:8px;
  color:#fff;
  cursor:pointer;
}

.pill{
  padding:4px 8px;
  border-radius:999px;
  background:#fff;
  border:1px solid var(--line);
  font-size:12px;
  margin-left:4px;
}

.risk-block{
  padding-left:12px;
  border-left:3px solid var(--blue);
  margin-top:10px;
}
</style>

</head>

<body>

<header>
  dj-safety 관리자 대시보드<br>
  <small>근로자 작업·확인·서명·위험요인 관리</small>

  <div class="top-buttons">
    <button class="top-btn" onclick="location.href='admin-check-dashboard.html'">근로자 확인 현황</button>
    <button class="top-btn" onclick="goRiskList()">위험요인 등록 현황</button>
    <button class="top-btn" onclick="goRiskAdmin()">위험요인 등록</button>
    <button class="top-btn" onclick="location.href='index.html'">홈으로</button>
  </div>
</header>

<main>

<!-- 조회 조건 -->
<div class="card">
  <h2>조회 조건</h2>

  <div class="row">
    <div class="field">
      <label>현장 ID</label>
      <input id="siteId" placeholder="paju">
    </div>

    <div class="field">
      <label>조회 날짜</label>
      <input id="date" type="date">
    </div>

    <div class="field">
      <label>근로자 이름(선택)</label>
      <input id="nameFilter" placeholder="김대홍">
    </div>

    <div class="field">
      <label>&nbsp;</label>
      <button id="loadBtn">조회</button>
    </div>
  </div>
</div>

<!-- 요약 -->
<div class="card">
  <h2>금일 작업 현황 요약</h2>

  <div class="summary-grid">
    <div class="summary">
      <div class="summary-label">오늘 작업자</div>
      <div id="sumTotal" class="summary-value">0명</div>
    </div>

    <div class="summary">
      <div class="summary-label">위험요인 확인</div>
      <div id="sumConfirmed" class="summary-value">0명</div>
    </div>

    <div class="summary">
      <div class="summary-label">작업 종료</div>
      <div id="sumFinished" class="summary-value">0명</div>
    </div>

    <div class="summary">
      <div class="summary-label">서명 미완료</div>
      <div id="sumUnsigned" class="summary-value">0명</div>
    </div>
  </div>
</div>

<!-- 근로자 작업 -->
<div class="card">
  <h2>근로자 작업 상세</h2>
  <div id="workersBox" class="muted">조회 후 표시됩니다.</div>
</div>

<!-- 전체 위험요인 -->
<div class="card">
  <h2>전체 위험요인 등록 현황</h2>
  <div id="riskAllBox" class="muted">조회 후 표시됩니다.</div>
</div>

</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* Firebase init */
const firebaseConfig = {
  apiKey: "AIzaSyAk4jLw9XKxxInc8ua7fZWGOJQKNV7gnzo",
  authDomain: "dj-safety.firebaseapp.com",
  projectId: "dj-safety"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* DOM */
const siteIdInput = document.getElementById("siteId");
const dateInput = document.getElementById("date");
const nameFilter = document.getElementById("nameFilter");
const loadBtn = document.getElementById("loadBtn");

const workersBox = document.getElementById("workersBox");
const riskAllBox = document.getElementById("riskAllBox");

const sumTotal = document.getElementById("sumTotal");
const sumConfirmed = document.getElementById("sumConfirmed");
const sumFinished = document.getElementById("sumFinished");
const sumUnsigned = document.getElementById("sumUnsigned");

/* 날짜 기본값 = 오늘 */
dateInput.value = new Date().toISOString().slice(0,10);

/* 위험요인 등록 화면 이동 */
window.goRiskAdmin = () => {
  const sid = siteIdInput.value.trim();
  if(!sid){
    alert("현장 ID를 먼저 입력하세요.");
    return;
  }
  location.href=`risk-admin.html?siteId=${sid}`;
};

/* 위험요인 등록 현황 이동 */
window.goRiskList = () => {
  const sid = siteIdInput.value.trim();
  if(!sid){
    alert("현장 ID를 먼저 입력하세요.");
    return;
  }
  location.href=`risk-list.html?siteId=${sid}`;
};

/* 조회 기능 */
loadBtn.onclick = async () => {

  const sid = siteIdInput.value.trim();
  const day = dateInput.value;
  const name = nameFilter.value.trim();

  if(!sid || !day){
    alert("현장 ID와 날짜를 입력하세요");
    return;
  }

  workersBox.innerHTML="불러오는 중...";
  riskAllBox.innerHTML="불러오는 중...";

  /* workerLogs 조회 */
  const snapWorkers = await getDocs(collection(db,"sites",sid,"workerLogs"));
  const logs=[];
  snapWorkers.forEach(docu=>{
    const d=docu.data();
    if(d.date===day){
      if(name && !(d.name||"").includes(name)) return;
      logs.push(d);
    }
  });

  sumTotal.innerText=logs.length+"명";
  sumConfirmed.innerText=logs.filter(w=>w.confirmAll).length+"명";
  sumFinished.innerText=logs.filter(w=>w.endAt).length+"명";
  sumUnsigned.innerText=logs.filter(w=>!w.startSignature||!w.endSignature).length+"명";

  if(logs.length===0){
    workersBox.innerHTML="<div class='muted'>작업 기록 없음</div>";
  }else{
    workersBox.innerHTML="";
    logs.forEach(w=>{
      const start=w.startAt?.toDate? w.startAt.toDate().toLocaleString() : "-";
      const end=w.endAt?.toDate? w.endAt.toDate().toLocaleString() : "-";

      const div=document.createElement("div");
      div.className="item";
      div.innerHTML=`
        <h3>${w.name} (${w.birth})</h3>
        <span class="muted">${w.siteId} · ${w.date}</span>
        ${w.jobType ? `<span class="pill">${w.jobType}</span>`:""}

        <div style="margin-top:8px">
          <b>작업 시작:</b> ${start}<br>
          <b>작업 종료:</b> ${end}
        </div>

        <div style="margin-top:8px">
          ${w.confirmAll
            ? `<span class="badge badge-ok">위험요인 확인 완료</span>`
            : `<span class="badge badge-draft">위험요인 미확인</span>`
          }
        </div>
      `;
      workersBox.appendChild(div);
    });
  }

  /* 전체 riskSets 조회 */
  const riskSnap = await getDocs(collection(db,"sites",sid,"riskSets"));
  const allRisk = [];
  riskSnap.forEach(docu => allRisk.push(docu.data()));

  if(allRisk.length===0){
    riskAllBox.innerHTML="<div class='muted'>위험요인 등록 없음</div>";
    return;
  }

  riskAllBox.innerHTML="";
  allRisk.sort((a,b)=> new Date(a.startDate) - new Date(b.startDate));

  allRisk.forEach(s=>{
    const now=new Date();
    const st=new Date(s.startDate);
    const en=new Date(s.endDate);

    let status="대기";
    let color="#6b7280";

    if(now>=st && now<=en){ status="적용 중"; color="#16a34a"; }
    else if(now>en){ status="종료"; color="#dc2626"; }

    const div=document.createElement("div");
    div.className="risk-card";
    div.innerHTML=`
      <div class="risk-title">${s.siteName}</div>
      <div class="risk-date">${s.startDate} ~ ${s.endDate}</div>
      <div class="risk-info">공종: ${s.workTypes.join(", ")}</div>
      <div class="risk-info">위험요인: ${(s.risks||[]).length}개</div>

      <div class="risk-status">
        <span class="status-pill" style="background:${color};">${status}</span>
        <button class="edit-btn"
          onclick="location.href='risk-admin.html?siteId=${sid}&id=${s.startDate}_${s.endDate}'">
          수정하기
        </button>
      </div>
    `;

    riskAllBox.appendChild(div);
  });
};
</script>

</body>
</html>

<!doctype html>
<html lang="ko">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>관리자 대시보드 | 위험요인 확인 현황</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body { margin:0; font-family:"Noto Sans KR",sans-serif; background:#f4f7ff; color:#0b1b3b; }
header { background:#004080; color:#fff; padding:20px; font-size:20px; font-weight:900; }
main { max-width:1100px; margin:20px auto; padding:0 16px; }

.card { background:#fff; border-radius:16px; padding:20px; margin-bottom:20px;
        box-shadow:0 10px 30px rgba(0,64,128,.12); }

label { font-size:13px; font-weight:700; color:#555; }
input { padding:10px; border-radius:10px; border:1px solid #cdd9ff; width:100%; }
button {
    padding:12px 20px; border-radius:10px; border:none; font-weight:900;
    background:#004080; color:#fff; cursor:pointer;
}
button:hover { opacity:.9; }

.row { display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end; }

.item {
  border:1px solid #cdd9ff; border-radius:12px; padding:18px;
  margin-top:16px; background:#f9fbff;
}

.badge { background:#dcfce7; color:#166534; padding:4px 10px; border-radius:999px;
        margin-bottom:10px; display:inline-block; font-size:12px; font-weight:800; }

.muted { color:#64748b; font-size:13px; }

.risk { border-left:3px solid #004080; margin-top:10px; padding-left:14px; }

.sig-img {
  max-width:210px;
  border:1px solid #ccc;
  border-radius:8px;
  margin-top:10px;
  background:white;
}

.downloadArea { display:flex; gap:10px; margin-top:10px; }
.downloadArea button { flex:1; }
</style>
</head>

<body>

<header>관리자 대시보드 · 근로자 위험요인 확인 현황</header>

<main>

<!-- 조회 조건 영역 -->
<div class="card">
  <h2>조회 조건</h2>

  <div class="row">

    <div style="flex:1">
      <label>현장 ID</label><br>
      <input id="siteId" placeholder="예: paju">
    </div>

    <div>
      <label>조회 시작일</label><br>
      <input id="startDate" type="date">
    </div>

    <div>
      <label>조회 종료일</label><br>
      <input id="endDate" type="date">
    </div>

    <div style="flex:1">
      <label>근로자 이름 (선택)</label><br>
      <input id="nameFilter" placeholder="예: 김대홍">
    </div>

    <div style="padding-top:22px">
      <button id="loadBtn">조회</button>
    </div>

  </div>
</div>

<!-- 다운로드 버튼 -->
<div class="card">
  <h2>데이터 다운로드</h2>
  <div class="downloadArea">
    <button id="csvBtn">CSV 다운로드</button>
    <button id="excelBtn">Excel(xlsx) 다운로드</button>
  </div>
</div>

<!-- 조회 결과 -->
<div class="card">
  <h2>조회 결과</h2>
  <div id="listBox" class="muted">조회 조건을 입력하세요</div>
</div>


</main>

<!-- SheetJS -->
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore,
  collection,
  query,
  where,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* Firebase 연결 */
const firebaseConfig = {
  apiKey: "AIzaSyAk4jLw9XKxxInc8ua7fZWGOJQKNV7gnzo",
  authDomain: "dj-safety.firebaseapp.com",
  projectId: "dj-safety"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* DOM 요소 */
const siteId = document.getElementById("siteId");
const startDate = document.getElementById("startDate");
const endDate = document.getElementById("endDate");
const nameFilter = document.getElementById("nameFilter");
const listBox = document.getElementById("listBox");

const loadBtn = document.getElementById("loadBtn");
const csvBtn = document.getElementById("csvBtn");
const excelBtn = document.getElementById("excelBtn");

let records = []; // 다운로드용 데이터 저장


/* 조회 버튼 클릭 */
loadBtn.onclick = async () => {

  const sid = siteId.value.trim();
  const start = startDate.value;
  const end = endDate.value;
  const filterName = nameFilter.value.trim();

  if (!sid || !start || !end) {
    alert("현장ID, 시작일, 종료일은 필수입니다.");
    return;
  }

  listBox.innerHTML = "불러오는 중...";
  records = [];

  const q = query(
    collection(db, "sites", sid, "workerLogs"),
    where("date", ">=", start),
    where("date", "<=", end)
  );

  const snap = await getDocs(q);
  listBox.innerHTML = "";

  if (snap.empty) {
    listBox.innerHTML = "<div class='muted'>데이터 없음</div>";
    return;
  }

  snap.forEach(doc => {
    const d = doc.data();

    // 이름 필터
    if (filterName && !d.name.includes(filterName)) return;

    const startTime = d.startAt?.toDate ? d.startAt.toDate().toLocaleString() : "-";
    const endTime = d.endAt?.toDate ? d.endAt.toDate().toLocaleString() : "-";

    const div = document.createElement("div");
    div.className = "item";

    div.innerHTML = `
      <b>${d.name}</b> (${d.birth})<br>
      <span class="muted">${d.siteId} · ${d.date}</span><br><br>

      <span class="badge">확인됨</span>
      <span class="muted"> 시작: ${startTime} / 종료: ${endTime}</span>

      <h4 style="margin-top:12px">작업 시작 서명</h4>
      ${d.startSignature ? `<img class="sig-img" src="${d.startSignature}">` : "<div class='muted'>서명 없음</div>"}

      <h4 style="margin-top:12px">작업 종료 서명</h4>
      ${d.endSignature ? `<img class="sig-img" src="${d.endSignature}">` : "<div class='muted'>서명 없음</div>"}

      <div class="risk">
        ${(d.risks || []).map(r => `
          <div>
            <b>${r.category}</b><br>
            ${r.detail}<br>
            <span class="muted">대책: ${r.counter}</span>
          </div>
        `).join("")}
      </div>
    `;

    listBox.appendChild(div);

    // 다운로드용 데이터 저장
    records.push({
      이름: d.name,
      생년월일: d.birth,
      현장ID: d.siteId,
      작업일: d.date,
      시작시간: startTime,
      종료시간: endTime,
      위험요인: (d.risks || []).map(r =>
        `${r.category}: ${r.detail} (대책:${r.counter})`).join(" / ")
    });
  });
};


/* CSV 다운로드 */
csvBtn.onclick = () => {
  if (records.length === 0) {
    alert("다운로드할 데이터가 없습니다.");
    return;
  }

  const header = Object.keys(records[0]);
  const rows = records.map(r => header.map(h => r[h]));

  let csv = "data:text/csv;charset=utf-8,\uFEFF";
  csv += header.join(",") + "\n";
  rows.forEach(row => {
    csv += row.map(val => `"${val}"`).join(",") + "\n";
  });

  const link = document.createElement("a");
  link.href = encodeURI(csv);
  link.download = "worker_logs.csv";
  link.click();
};


/* Excel 다운로드 */
excelBtn.onclick = () => {
  if (records.length === 0) {
    alert("다운로드할 데이터가 없습니다.");
    return;
  }

  const ws = XLSX.utils.json_to_sheet(records);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "logs");
  XLSX.writeFile(wb, "worker_logs.xlsx");
};

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>장비운전원 작업 기록 | 동진토건(주)</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:"Noto Sans KR",sans-serif;
  background:#f4f7ff;
  color:#0b1b3b;
}
main{max-width:900px;margin:20px auto;padding:0 16px}
.card{
  background:#fff;
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,64,128,.12);
  padding:20px;
  margin-bottom:20px
}
h2{margin:0 0 12px}
label{font-size:14px;font-weight:700;color:#555;display:block;margin-top:12px}
input,select{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #d9e2ef;
  margin-top:6px;
  font-size:16px;
}

/* 작업계획서 버튼 */
.plan-btn{
  width:100%;
  padding:20px;
  margin-top:18px;
  border-radius:18px;
  border:none;
  background:linear-gradient(135deg,#ff7a00,#ffb000);
  color:#fff;
  font-size:19px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 16px 40px rgba(255,138,0,.45);
  animation:pulse 1.6s infinite;
}
@keyframes pulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.04)}
  100%{transform:scale(1)}
}
.plan-btn:disabled{
  background:#94a3b8;
  animation:none;
}

.plan-item{
  background:#fff7ed;
  border:2px solid #ffb000;
  padding:14px;
  border-radius:12px;
  margin-top:12px;
  font-weight:800;
}
.plan-item a{
  display:inline-block;
  margin-top:8px;
  padding:8px 14px;
  background:#ff7a00;
  color:#fff;
  border-radius:8px;
  text-decoration:none;
  font-weight:900;
}

.warn{
  margin-top:14px;
  padding:14px;
  border-radius:12px;
  background:#fee2e2;
  color:#991b1b;
  font-weight:900;
  text-align:center;
}

.risk{
  border:1px solid #cdd9ff;
  border-radius:12px;
  padding:14px;
  background:#f9fbff;
  margin-bottom:10px;
}

.signature-pad{
  border:2px dashed #004080;
  border-radius:10px;
  width:100%;
  height:220px;
  background:#fff;
  margin-top:10px;
  touch-action:none;
}

button.primary{
  width:100%;
  padding:18px;
  border:none;
  border-radius:16px;
  font-size:18px;
  font-weight:900;
  background:#004080;
  color:#fff;
  cursor:pointer;
  margin-top:18px
}
button.primary:disabled{
  background:#94a3b8;
  cursor:not-allowed
}
.notice{
  text-align:center;
  font-weight:800;
  color:#004080;
  margin-top:12px
}
</style>
</head>

<body>
<main>

<div class="card">
  <h2>장비운전원 기본정보</h2>

  <label>현장 ID</label>
  <input id="siteId" value="paju" readonly>

  <label>오늘 날짜</label>
  <input id="workDate" readonly>

  <label>운전원 이름</label>
  <input id="operatorName">

  <label>장비 종류</label>
  <select id="equipmentType">
    <option value="">선택</option>
    <option>굴착기</option>
    <option>지게차</option>
    <option>크레인</option>
    <option>덤프트럭</option>
    <option>로더</option>
  </select>

  <label>장비 번호</label>
  <input id="equipmentId" placeholder="예: 05가1234">
</div>

<button id="planBtn" class="plan-btn" onclick="loadWorkplanByEquipment()">
  📄 작업계획서 확인 · 다운로드 (필수)
</button>

<div id="workplanList"></div>

<div id="planWarn" class="warn" style="display:none;">
  ⚠ 작업계획서를 최소 1회 이상 열어야 작업개시가 가능합니다
</div>

<div class="card">
  <h2>금일 적용 위험요인</h2>
  <div id="riskBox">불러오는 중...</div>

  <label>
    <input type="checkbox" id="confirmAll">
    <b>위의 모든 위험요인을 확인했습니다.</b>
  </label>
</div>

<div class="card">
  <h2>작업 시작 서명</h2>
  <canvas id="signStart" class="signature-pad"></canvas>
  <button class="primary" id="clearStart">서명 지우기</button>

  <button class="primary" id="startBtn" disabled>
    위험요인 및 작업계획서 확인 후 작업개시
  </button>

  <div id="startMsg" class="notice"></div>
</div>

</main>

<script type="module">
document.getElementById("workDate").value =
  new Date().toISOString().slice(0,10);

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore, collection, getDocs, doc, setDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import {
  getStorage, ref, listAll, getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

/* Firebase */
const app = initializeApp({
  apiKey: "AIzaSyAk4jLw9XKxxInc8ua7fZWGOJQKNV7gnzo",
  authDomain: "dj-safety.firebaseapp.com",
  projectId: "dj-safety"
});
const db = getFirestore(app);

const storageApp = initializeApp({
  apiKey: "AIzaSyDPP-hf5ja5zvSBPTgLt-a2fVzgbh3cfg0",
  authDomain: "dongjin-workplan.firebaseapp.com",
  projectId: "dongjin-workplan",
  storageBucket: "dongjin-workplan.firebasestorage.app"
},"storage");
const storage = getStorage(storageApp);

const siteId = document.getElementById("siteId");
const workDate = document.getElementById("workDate");
const riskBox = document.getElementById("riskBox");
const confirmAll = document.getElementById("confirmAll");
const startBtn = document.getElementById("startBtn");
const planWarn = document.getElementById("planWarn");
const workplanList = document.getElementById("workplanList");

let todayRisks=[];
let planOpened=false;
let signed=false;

/* 위험요인 (기간 적용) */
async function loadRisks(){
  const snap = await getDocs(collection(db,"sites",siteId.value,"riskSets"));
  const today = new Date(workDate.value);
  todayRisks=[];
  riskBox.innerHTML="";

  snap.forEach(d=>{
    const r=d.data();
    const st=new Date(r.startDate);
    const en=new Date(r.endDate);
    if(today>=st && today<=en){
      (r.risks||[]).forEach(x=>todayRisks.push(x));
    }
  });

  if(todayRisks.length===0){
    riskBox.innerHTML="적용 중 위험요인 없음";
    return;
  }

  todayRisks.forEach(r=>{
    riskBox.innerHTML+=`
      <div class="risk">
        <label>
          <input type="checkbox" class="riskChk">
          <b>${r.category}</b><br>${r.detail}<br><i>${r.counter}</i>
        </label>
      </div>`;
  });

  document.querySelectorAll(".riskChk").forEach(c=>{
    c.onchange=checkReady;
  });
}
loadRisks();

/* 작업계획서 */
window.loadWorkplanByEquipment = async ()=>{
  const eid = equipmentId.value.trim();
  if(eid.length<4){alert("장비번호 입력");return;}

  workplanList.innerHTML="<div class='notice'>📄 작업계획서 불러오는 중...</div>";
  planOpened=false;
  checkReady();

  const last4=eid.slice(-4);
  const root=ref(storage,"/");
  const all=await listAll(root);

  workplanList.innerHTML="";
  for(const d of all.prefixes){
    const t=await listAll(d);
    for(const f of t.prefixes){
      const files=await listAll(f);
      for(const item of files.items){
        if(item.fullPath.includes(last4)){
          const url=await getDownloadURL(item);
          planOpened=true;
          workplanList.innerHTML+=`
            <div class="plan-item">
              ${item.fullPath}
              <a href="${url}" target="_blank"
                 onclick="planOpened=true;checkReady()">
                작업계획서 열기
              </a>
            </div>`;
        }
      }
    }
  }
  checkReady();
};

/* 서명 */
let canvas,ctx,drawing=false,lx=0,ly=0;
function initSign(){
  canvas=document.getElementById("signStart");
  const r=canvas.getBoundingClientRect();
  const dpr=window.devicePixelRatio||1;
  canvas.width=r.width*dpr;
  canvas.height=r.height*dpr;
  ctx=canvas.getContext("2d");
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.lineWidth=4;
  ctx.lineCap="round";

  const pos=e=>{
    const rect=canvas.getBoundingClientRect();
    const p=e.touches?e.touches[0]:e;
    return{x:p.clientX-rect.left,y:p.clientY-rect.top};
  };

  const start=e=>{
    e.preventDefault();drawing=true;signed=true;
    const p=pos(e);lx=p.x;ly=p.y;checkReady();
  };
  const move=e=>{
    if(!drawing)return;e.preventDefault();
    const p=pos(e);
    ctx.beginPath();
    ctx.moveTo(lx,ly);
    ctx.lineTo(p.x,p.y);
    ctx.stroke();
    lx=p.x;ly=p.y;
  };
  const end=()=>drawing=false;

  canvas.addEventListener("mousedown",start);
  canvas.addEventListener("mousemove",move);
  canvas.addEventListener("mouseup",end);
  canvas.addEventListener("touchstart",start,{passive:false});
  canvas.addEventListener("touchmove",move,{passive:false});
  canvas.addEventListener("touchend",end);

  clearStart.onclick=()=>{
    ctx.clearRect(0,0,canvas.width,canvas.height);
    signed=false;
    checkReady();
  };
}
window.onload=()=>setTimeout(initSign,0);

/* 체크 */
confirmAll.onchange=checkReady;
function checkReady(){
  const riskOk=[...document.querySelectorAll(".riskChk")].every(c=>c.checked);
  if(!planOpened){
    planWarn.style.display="block";
    startBtn.disabled=true;
    return;
  }
  planWarn.style.display="none";
  startBtn.disabled=!(riskOk && signed);
}

/* 작업개시 */
startBtn.onclick=async()=>{
  await setDoc(doc(db,"sites",siteId.value,"equipmentLogs",
    `${workDate.value}_${operatorName.value}`),{
    operatorName:operatorName.value,
    equipmentId:equipmentId.value,
    equipmentType:equipmentType.value,
    risks:todayRisks,
    workplanConfirmed:true,
    startSignature:canvas.toDataURL(),
    startAt:serverTimestamp()
  });
  startMsg.innerText="작업개시 완료";
};
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>장비운전원 작업 기록 | 동진토건(주)</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:"Noto Sans KR",sans-serif;
  background:#f4f7ff;
  color:#0b1b3b;
}
main{max-width:900px;margin:20px auto;padding:0 16px}
.card{
  background:#fff;
  border-radius:16px;
  box-shadow:0 10px 30px rgba(0,64,128,.12);
  padding:20px;
  margin-bottom:20px
}
h2{margin:0 0 12px}

label{font-size:14px;font-weight:700;color:#555;display:block;margin-top:12px}
input, select{
  width:100%;
  padding:12px;
  border:1px solid #d9e2ef;
  border-radius:10px;
  margin-top:6px;
  font-size:16px;
}

/* 🔥 작업계획서 강조 버튼 */
.plan-download-btn{
  width:100%;
  padding:20px;
  margin-top:18px;
  border-radius:18px;
  border:none;
  background:linear-gradient(135deg,#ff7a00,#ffb000);
  color:#fff;
  font-size:19px;
  font-weight:900;
  box-shadow:0 16px 40px rgba(255,138,0,.45);
  cursor:pointer;
  animation:pulse 1.6s infinite;
}
@keyframes pulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.04)}
  100%{transform:scale(1)}
}
.plan-download-btn:active{transform:scale(.97)}

.plan-item{
  background:#fff7ed;
  border:2px solid #ffb000;
  padding:14px;
  border-radius:12px;
  margin-top:12px;
  font-size:15px;
  font-weight:700;
}
.plan-item a{
  display:inline-block;
  margin-top:8px;
  padding:8px 14px;
  background:#ff7a00;
  color:#fff;
  border-radius:8px;
  text-decoration:none;
  font-weight:900;
}

.risk{
  border:1px solid #cdd9ff;
  border-radius:12px;
  padding:14px;
  background:#f9fbff;
  margin-bottom:10px;
}

.signature-pad{
  border:2px dashed #004080;
  border-radius:10px;
  width:100%;
  height:220px;
  background:#fff;
  margin-top:10px;
  touch-action:none;
}

.notice{
  margin-top:15px;
  text-align:center;
  font-weight:800;
  color:#004080;
}

.warn{
  margin-top:14px;
  padding:14px;
  border-radius:12px;
  background:#fee2e2;
  color:#991b1b;
  font-weight:900;
  text-align:center;
}
button.primary{
  width:100%;
  padding:18px;
  border:none;
  border-radius:16px;
  font-size:18px;
  font-weight:900;
  background:#004080;
  color:#fff;
  cursor:pointer;
  margin-top:18px;
}
button.primary:disabled{
  background:#94a3b8;
  cursor:not-allowed;
}
</style>
</head>

<body>
<main>

<!-- 기본 정보 -->
<div class="card">
  <h2>장비운전원 기본정보</h2>

  <label>현장 ID</label>
  <input id="siteId" value="paju" readonly>

  <label>오늘 날짜</label>
  <input id="workDate" readonly>

  <label>운전원 이름</label>
  <input id="operatorName">

  <label>장비 종류</label>
  <select id="equipmentType">
    <option value="">선택</option>
    <option>굴착기</option>
    <option>지게차</option>
    <option>크레인</option>
    <option>덤프트럭</option>
    <option>로더</option>
  </select>

  <label>장비 번호</label>
  <input id="equipmentId" placeholder="예: 05가1234">
</div>

<!-- 🔥 작업계획서 -->
<button class="plan-download-btn" onclick="loadWorkplanByEquipment()">
  📄 작업계획서 확인 · 다운로드 (필수)
</button>

<div id="workplanList"></div>

<div id="planWarn" class="warn" style="display:none;">
  ⚠ 작업계획서를 최소 1회 이상 열어야 작업개시가 가능합니다
</div>

<!-- 위험요인 -->
<div class="card">
  <h2>금일 적용 위험요인</h2>
  <div id="riskBox">불러오는 중...</div>

  <label style="margin-top:20px">
    <input type="checkbox" id="confirmAll">
    <b>위의 모든 위험요인을 확인했습니다.</b>
  </label>
</div>

<!-- 작업 시작 -->
<div class="card">
  <h2>작업 시작 서명</h2>
  <canvas id="signStart" class="signature-pad"></canvas>
  <button class="primary" id="clearStart">서명 지우기</button>

  <button class="primary" id="startBtn" disabled>
    위험요인 및 작업계획서 확인 후 작업개시
  </button>

  <div id="startMsg" class="notice"></div>
</div>

</main>

<script type="module">
/* 오늘 날짜 */
document.getElementById("workDate").value =
  new Date().toISOString().slice(0,10);

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getFirestore, collection, getDocs, doc, setDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
import {
  getStorage, ref, listAll, getDownloadURL
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

/* Firestore */
const app = initializeApp({
  apiKey: "AIzaSyAk4jLw9XKxxInc8ua7fZWGOJQKNV7gnzo",
  authDomain: "dj-safety.firebaseapp.com",
  projectId: "dj-safety"
});
const db = getFirestore(app);

/* Storage */
const storageApp = initializeApp({
  apiKey: "AIzaSyDPP-hf5ja5zvSBPTgLt-a2fVzgbh3cfg0",
  authDomain: "dongjin-workplan.firebaseapp.com",
  projectId: "dongjin-workplan",
  storageBucket: "dongjin-workplan.firebasestorage.app"
},"storage");
const storage = getStorage(storageApp);

/* 상태 */
let todayRisks=[];
let planOpened=false;

/* ================= 모바일 대응 서명 ================= */
let signed=false;
let canvas, ctx, drawing=false, lx=0, ly=0;

function initSignature(){
  canvas=document.getElementById("signStart");
  const rect=canvas.getBoundingClientRect();
  const ratio=window.devicePixelRatio||1;

  canvas.width=rect.width*ratio;
  canvas.height=rect.height*ratio;
  ctx=canvas.getContext("2d");
  ctx.setTransform(ratio,0,0,ratio,0,0);
  ctx.lineCap="round";
  ctx.lineJoin="round";
  ctx.lineWidth=4.5;

  const pos=e=>{
    const r=canvas.getBoundingClientRect();
    const p=e.touches?e.touches[0]:e;
    return{x:p.clientX-r.left,y:p.clientY-r.top};
  };

  const start=e=>{
    e.preventDefault();
    drawing=true;
    signed=true;
    const p=pos(e); lx=p.x; ly=p.y;
    checkReady();
  };
  const move=e=>{
    if(!drawing) return;
    e.preventDefault();
    const p=pos(e);
    ctx.beginPath();
    ctx.moveTo(lx,ly);
    ctx.lineTo(p.x,p.y);
    ctx.stroke();
    lx=p.x; ly=p.y;
  };
  const end=()=>drawing=false;

  canvas.addEventListener("mousedown",start);
  canvas.addEventListener("mousemove",move);
  canvas.addEventListener("mouseup",end);
  canvas.addEventListener("mouseleave",end);
  canvas.addEventListener("touchstart",start,{passive:false});
  canvas.addEventListener("touchmove",move,{passive:false});
  canvas.addEventListener("touchend",end);

  document.getElementById("clearStart").onclick=()=>{
    ctx.clearRect(0,0,canvas.width,canvas.height);
    signed=false;
    checkReady();
  };
}
requestAnimationFrame(initSignature);

/* 작업계획서 */
window.loadWorkplanByEquipment = async ()=>{ /* 기존 코드 그대로 */ };

/* 위험요인 */
async function loadRisks(){
  const snap=await getDocs(collection(db,"sites",siteId.value,"riskSets"));
  riskBox.innerHTML="";
  todayRisks=[];
  snap.forEach(d=>{
    (d.data().risks||[]).forEach(x=>todayRisks.push(x));
  });
  todayRisks.forEach(r=>{
    riskBox.innerHTML+=`
      <div class="risk">
        <label>
          <input type="checkbox" class="riskChk">
          <b>${r.category}</b><br>${r.detail}<br><i>${r.counter}</i>
        </label>
      </div>`;
  });
}
loadRisks();

/* 체크 */
confirmAll.onchange=checkReady;
function checkReady(){
  const riskOk=[...document.querySelectorAll(".riskChk")].every(c=>c.checked);
  if(!planOpened){
    planWarn.style.display="block";
    startBtn.disabled=true;
    return;
  }
  planWarn.style.display="none";
  startBtn.disabled=!(riskOk && signed);
}

/* 작업 시작 저장 */
startBtn.onclick=async()=>{
  await setDoc(doc(db,"sites",siteId.value,"equipmentLogs",
    `${workDate.value}_${operatorName.value}`),{
    operatorName:operatorName.value,
    equipmentId:equipmentId.value,
    equipmentType:equipmentType.value,
    risks:todayRisks,
    workplanConfirmed:true,
    startSignature:canvas.toDataURL(),
    startAt:serverTimestamp()
  });
  startMsg.innerText="작업개시 완료";
};
</script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>동진토건(주) 위험성평가전파</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">

<style>
:root{
  --blue:#004080;
  --green:#16a34a;
  --bg:#f1f5ff;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:"Noto Sans KR",sans-serif;
  background:linear-gradient(180deg,#eef3ff 0%,#f7f9ff 100%);
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  color:#0b1b3b;
}

.container{
  width:100%;
  max-width:420px;
  padding:20px;
}

.card{
  background:#fff;
  border-radius:26px;
  padding:42px 26px 36px;
  box-shadow:0 30px 80px rgba(0,64,128,.18);
  text-align:center;
}

/* 현장 표시 */
.site-badge{
  display:inline-block;
  padding:8px 18px;
  border-radius:999px;
  background:linear-gradient(135deg,#004080,#0072ff);
  color:#fff;
  font-weight:900;
  font-size:14px;
  margin-bottom:18px;
}

h1{
  margin:0 0 6px;
  font-size:24px;
  font-weight:900;
  letter-spacing:-.02em;
}

.sub{
  font-size:14px;
  color:#64748b;
  margin-bottom:36px;
  line-height:1.6;
}

/* 버튼 */
.btn{
  width:100%;
  padding:20px;
  border-radius:18px;
  border:none;
  font-size:18px;
  font-weight:900;
  cursor:pointer;
  margin-top:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  transition:.2s;
}

.btn:active{transform:scale(.97)}

.start{
  background:linear-gradient(135deg,#16a34a,#22c55e);
  color:#fff;
  box-shadow:0 14px 34px rgba(22,163,74,.35);
}

.end{
  background:#fff;
  color:#004080;
  border:2px solid rgba(0,64,128,.25);
}

.start:hover{box-shadow:0 18px 44px rgba(22,163,74,.45)}
.end:hover{background:#f0f5ff}

.footer{
  margin-top:26px;
  font-size:12px;
  color:#94a3b8;
  line-height:1.6;
}
</style>
</head>

<body>

<div class="container">
  <div class="card">

    <!-- 현장명 -->
    <div class="site-badge">📍 울산 태화강</div>

    <h1>동진토건(주) 위험성평가전파</h1>
    <div class="sub">
      근로자 안전 · 작업 관리 시스템<br>
      지금 진행할 작업을 선택하세요
    </div>

    <!-- 작업 시작 -->
    <button class="btn start" onclick="goStart()">
      ▶️ 작업 시작
    </button>

    <!-- 작업 종료 -->
    <button class="btn end" onclick="goEnd()">
      🏁 작업 종료
    </button>

    <div class="footer">
      Dongjin Construction<br>
      Safety Management System
    </div>

  </div>
</div>

<script>
/* 🔒 울산 태화강 고정 */
const SITE_ID = "ulsan-taehwagang";

function goStart(){
  location.href = `worker-start.html?siteId=${SITE_ID}`;
}

function goEnd(){
  location.href = `worker-end.html?siteId=${SITE_ID}`;
}
</script>

</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>울산 태화강 현장 | 동진토건</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:"Noto Sans KR",sans-serif;
  background:#f4f7ff;
  color:#0b1b3b;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
}
.card{
  background:#fff;
  border-radius:26px;
  padding:42px 28px;
  box-shadow:0 24px 60px rgba(0,64,128,.2);
  max-width:420px;
  width:100%;
  text-align:center;
}
.site{
  display:inline-block;
  padding:8px 18px;
  border-radius:999px;
  background:linear-gradient(135deg,#004080,#1e66d0);
  color:#fff;
  font-weight:900;
  font-size:14px;
  margin-bottom:18px;
}
h1{
  margin:0 0 10px;
  font-size:24px;
  font-weight:900;
}
.sub{
  font-size:14px;
  color:#64748b;
  margin-bottom:28px;
  line-height:1.6;
}
.btn{
  width:100%;
  padding:18px;
  border-radius:18px;
  border:none;
  font-size:18px;
  font-weight:900;
  cursor:pointer;
  margin-top:14px;
}
.worker{
  background:linear-gradient(135deg,#16a34a,#22c55e);
  color:#fff;
}
.equipment{
  background:linear-gradient(135deg,#f59e0b,#fbbf24);
  color:#1f2937;
}
.admin{
  background:#004080;
  color:#fff;
}
.out{
  background:#fff;
  border:2px solid #cdd9ff;
  color:#004080;
}
.footer{
  margin-top:26px;
  font-size:12px;
  color:#94a3b8;
  line-height:1.6;
}
</style>
</head>

<body>

<div class="card">
  <div class="site">📍 울산 태화강</div>

  <h1>현장 안전관리 시스템</h1>
  <div class="sub">
    근로자 · 장비 · 위험요인<br>
    통합 안전관리
  </div>

  <!-- 근로자 작업 -->
  <button class="btn worker" onclick="go('worker-gate.html')">
    👷 근로자 작업 시작 / 종료
  </button>

  <!-- 장비 작업 -->
  <button class="btn equipment" onclick="go('equipment-log.html')">
    🚜 장비 작업 시작
  </button>

  <!-- 관리자 -->
  <button class="btn admin" onclick="go('dashboard.html')">
    🧑‍💼 관리자 대시보드
  </button>

  <!-- 상위 인덱스로 -->
  <button class="btn out" onclick="location.href='../index.html'">
    ⬅ 현장 선택으로
  </button>

  <div class="footer">
    Dongjin Construction<br>
    Safety Management System
  </div>
</div>

<script>
function go(page){
  location.href = page;
}
</script>

</body>
</html>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>동진토건(주) 위험성평가공유 | 파주 PMC 현장</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">

<style>
:root{
  --blue:#003366;
  --blue2:#0055aa;
  --green:#16a34a;
  --bg:#eef3ff;
  --card:#ffffff;
  --muted:#64748b;
}

/* Reset */
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:"Noto Sans KR",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:linear-gradient(180deg,#dbe8ff 0%,#eef3ff 40%,#f7f9ff 100%);
  color:#0b1b3b;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
  padding:20px;
}

/* 중앙 카드 */
.container{
  width:100%;
  max-width:440px;
}

.card{
  background:var(--card);
  border-radius:28px;
  box-shadow:
    0 25px 60px rgba(0,64,128,.20),
    0 0 40px rgba(0,85,170,.20) inset;
  padding:48px 30px 40px;
  text-align:center;
  position:relative;
  overflow:hidden;
}

/* 카드 상단 빛 효과 */
.card::before{
  content:"";
  position:absolute;
  top:-140px;
  left:-120px;
  width:260px;
  height:260px;
  background:radial-gradient(circle,rgba(0,119,255,0.22),transparent 60%);
  z-index:0;
}

/* 현장명 뱃지 */
.site-badge{
  display:inline-block;
  padding:8px 22px;
  border-radius:999px;
  background:linear-gradient(135deg,#003366,#0066cc);
  color:#fff;
  font-weight:900;
  font-size:15px;
  box-shadow:0 10px 25px rgba(0,85,170,.35);
  margin-bottom:22px;
  position:relative;
  z-index:2;
}

/* 타이틀 */
h1{
  margin:0 0 8px;
  font-size:24px;
  font-weight:900;
  letter-spacing:-.02em;
  color:#00264d;
  position:relative;
  z-index:2;
}

.sub{
  font-size:15px;
  color:var(--muted);
  margin-bottom:38px;
  line-height:1.6;
  position:relative;
  z-index:2;
}

/* 버튼 */
.btn{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  width:100%;
  padding:18px;
  border-radius:18px;
  border:none;
  font-size:18px;
  font-weight:900;
  cursor:pointer;
  transition:all .25s ease;
  position:relative;
  z-index:2;
}

.btn:active{
  transform:scale(.97);
}

/* 근로자 버튼 */
.worker{
  background:linear-gradient(135deg,#16a34a,#22c55e);
  color:#fff;
  box-shadow:0 12px 35px rgba(22,163,74,.40);
}
.worker:hover{
  box-shadow:0 16px 45px rgba(22,163,74,.55);
}

/* 관리자 버튼 */
.admin{
  background:linear-gradient(135deg,#ffffff,#f1f5ff);
  color:var(--blue);
  border:2px solid rgba(0,64,128,.18);
  box-shadow:0 10px 25px rgba(0,64,128,.12);
}
.admin:hover{
  background:#f0f5ff;
}

/* 푸터 */
.footer{
  margin-top:30px;
  font-size:12px;
  color:#94a3b8;
  line-height:1.6;
  position:relative;
  z-index:2;
}
</style>
</head>

<body>

<div class="container">
  <div class="card">

    <!-- 현장명 강조 -->
    <div class="site-badge">📍 파주 PMC 현장</div>

    <h1>동진토건(주) 위험성평가전파</h1>

    <div class="sub">
      파주 PMC 현장 전용<br>
      근로자 위험요인 확인 및 작업 시작 시스템
    </div>

    <!-- 근로자 버튼 -->
    <button class="btn worker" onclick="goWorker()">
      👷 위험요인 확인 후 작업 시작
    </button>

    <!-- 관리자 버튼 -->
    <button class="btn admin" onclick="goAdmin()">
      👨‍💼 관리자 대시보드
    </button>

    <div class="footer">
      Dongjin Construction<br>
      Safety Management System
    </div>
  </div>
</div>

<script>
function goWorker(){
  location.href = "worker-log.html?siteId=paju";
}
function goAdmin(){
  location.href = "dashboard.html";
}
</script>

</body>
</html>
